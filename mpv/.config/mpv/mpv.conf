# Use mpv's built-in high-quality profile and user interface.
profile=high-quality
vo=gpu-next

# Iris Xe has no Vulkan Video decoding; name VAAPI so mpv skips that probe.
gpu-api=vulkan
hwdec=vaapi

# Keep a 4K window inside the screen and stay on the last frame at the end.
autofit-larger=90%x90%
keep-open=yes

# Resume position and track choices, not volume or other session state.
save-position-on-quit=yes
resume-playback-check-mtime=yes
watch-later-options=start,vid,aid,sid,secondary-sid,audio-delay,sub-delay

alang=zh,zho,chi,ja,jpn,en,eng
slang=zh,zho,chi,chs,sc,cht,tc,ja,jpn,en,eng
sub-auto=fuzzy
sub-file-paths=sub:subs:Subs:subtitles
audio-file-auto=fuzzy

screenshot-format=png
screenshot-dir=~/Pictures/mpv
screenshot-template="%F-%wH%wM%wS"
