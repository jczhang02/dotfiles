# Use mpv's built-in high-quality profile and user interface.
profile=high-quality
vo=gpu-next

# Intel Iris Xe on Wayland lacks Vulkan Video decoding; OpenGL uses VAAPI directly.
gpu-api=opengl
hwdec=auto

save-position-on-quit=yes

alang=zh,zho,chi,ja,jpn,en,eng
slang=zh,zho,chi,ja,jpn,en,eng
sub-auto=fuzzy
audio-file-auto=fuzzy

screenshot-format=png
