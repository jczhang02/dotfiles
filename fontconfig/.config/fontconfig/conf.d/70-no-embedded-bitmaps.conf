<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- SimSun and similar Windows fonts carry bitmap strikes for small
       sizes. Use their outlines instead; color emoji fonts are bitmaps
       themselves and keep them. -->
  <match target="font">
    <test name="color"><bool>false</bool></test>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
