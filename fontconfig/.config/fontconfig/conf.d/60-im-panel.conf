<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Virtual family for the kimpanel input method popup: Latin (pinyin,
       candidate numbers) from the desktop UI face, Chinese from LXGW WenKai.
       The extension takes a single font name, so the pairing lives here.
       Strong binding keeps LXGW ahead of the Noto CJK that 50-generic adds. -->
  <alias binding="strong">
    <family>IM Panel</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>LXGW WenKai</family>
    </prefer>
  </alias>
</fontconfig>
