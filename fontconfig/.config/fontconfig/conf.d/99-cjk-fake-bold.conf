<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- LXGW WenKai Mono is too thin next to Latin terminal fonts: embolden it
       and mark the result bold so apps do not embolden it a second time. -->
  <match target="font">
    <test name="family" compare="contains"><string>LXGW WenKai Mono</string></test>
    <test name="weight" compare="less_eq"><int>500</int></test>
    <edit name="embolden" mode="assign"><bool>true</bool></edit>
    <edit name="weight" mode="assign"><int>200</int></edit>
  </match>
</fontconfig>
