<!-- ~/.config/fontconfig/conf.d/99-cjk-fake-bold.conf -->
<match target="font">
 <test name="family" compare="contains"><string>LXGW WenKai Mono</string></test>
 <test name="weight" compare="less_eq"><int>500</int></test>
 <edit name="embolden" mode="assign"><bool>true</bool></edit>
 <edit name="weight" mode="assign"><int>200</int></edit>
</match>
