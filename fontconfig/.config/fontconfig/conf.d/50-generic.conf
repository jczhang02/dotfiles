<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Generic families: a Latin face, then Noto CJK, then Noto for wide
       script coverage and color emoji. Rendering is left to the system
       defaults (grayscale antialiasing, hintslight). -->
  <match target="pattern">
    <test name="family">
      <string>system-ui</string>
    </test>
    <edit binding="strong" mode="prepend" name="family">
      <string>sans-serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>ui-monospace</string>
    </test>
    <edit binding="strong" mode="prepend" name="family">
      <string>monospace</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit binding="strong" mode="prepend" name="family">
      <string>Adwaita Sans</string>
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>serif</string>
    </test>
    <edit binding="strong" mode="prepend" name="family">
      <string>Noto Serif</string>
      <string>Noto Serif CJK SC</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <!-- Strong binding keeps the Latin face first even when the request
       carries a CJK lang. -->
  <match target="pattern">
    <test name="family">
      <string>monospace</string>
    </test>
    <edit binding="strong" mode="prepend" name="family">
      <string>JetBrainsMono NFM</string>
      <string>Noto Sans Mono CJK SC</string>
      <string>Noto Sans Mono</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>
</fontconfig>
