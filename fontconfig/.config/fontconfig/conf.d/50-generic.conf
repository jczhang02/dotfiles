<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Generic families: a Latin face, then Noto CJK, then Noto for wide
       script coverage, then Twemoji for color emoji. Rendering is left to
       the system defaults (grayscale antialiasing, hintslight). -->
  <!-- Twemoji ships CBDT bitmaps, so Chrome and Electron render it like
       Noto Color Emoji. Strong binding beats the Noto preference in the
       system 65-emoji rules; Noto Color Emoji stays as the fallback for
       code points a Twemoji release does not cover yet. -->
  <alias binding="strong">
    <family>emoji</family>
    <prefer>
      <family>Twemoji</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <!-- Chinese web CSS names Apple/Windows fonts ahead of sans-serif; send
       them to the system CJK face so pages match the desktop. Strong
       binding makes Chrome accept the substitute. -->
  <alias binding="strong">
    <family>PingFang SC</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Hiragino Sans GB</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Heiti SC</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Microsoft YaHei</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <!-- Web CSS names Arial before sans-serif; the real Arial is installed
       but is thinner than Noto CJK Regular, so mixed lines look uneven.
       Use the desktop Latin face instead. -->
  <alias binding="strong">
    <family>Arial</family>
    <prefer><family>Adwaita Sans</family></prefer>
  </alias>
  <match target="pattern">
    <test name="family">
      <string>system-ui</string>
    </test>
    <edit binding="strong" mode="prepend" name="family">
      <string>sans-serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>ui-monospace</string>
    </test>
    <edit binding="strong" mode="prepend" name="family">
      <string>monospace</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit binding="strong" mode="prepend" name="family">
      <string>Adwaita Sans</string>
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans</string>
      <string>Twemoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>serif</string>
    </test>
    <edit binding="strong" mode="prepend" name="family">
      <string>Noto Serif</string>
      <string>Noto Serif CJK SC</string>
      <string>Twemoji</string>
    </edit>
  </match>
  <!-- Strong binding keeps the Latin face first even when the request
       carries a CJK lang. -->
  <match target="pattern">
    <test name="family">
      <string>monospace</string>
    </test>
    <edit binding="strong" mode="prepend" name="family">
      <string>JetBrainsMono NFM</string>
      <string>Noto Sans Mono CJK SC</string>
      <string>Noto Sans Mono</string>
      <string>Twemoji</string>
    </edit>
  </match>
</fontconfig>
