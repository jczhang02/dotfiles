<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Noto CJK Regular is thin at 12-15px under grayscale antialiasing:
       most stroke pixels land in mid grey and text looks blurry. Serve
       the Medium face for regular-weight requests; bold requests keep the
       real Bold face. Runs after 51-language-noto-cjk.conf so the
       language remap has already picked the SC/TC/JP/KR family. -->
  <match target="pattern">
    <test name="family"><string>Noto Sans CJK SC</string></test>
    <test name="weight" qual="all" compare="less_eq"><const>medium</const></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC Medium</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Sans CJK TC</string></test>
    <test name="weight" qual="all" compare="less_eq"><const>medium</const></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK TC Medium</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Sans CJK HK</string></test>
    <test name="weight" qual="all" compare="less_eq"><const>medium</const></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK HK Medium</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Sans CJK JP</string></test>
    <test name="weight" qual="all" compare="less_eq"><const>medium</const></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK JP Medium</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Sans CJK KR</string></test>
    <test name="weight" qual="all" compare="less_eq"><const>medium</const></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK KR Medium</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Serif CJK SC</string></test>
    <test name="weight" qual="all" compare="less_eq"><const>medium</const></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Serif CJK SC Medium</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Serif CJK TC</string></test>
    <test name="weight" qual="all" compare="less_eq"><const>medium</const></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Serif CJK TC Medium</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Serif CJK JP</string></test>
    <test name="weight" qual="all" compare="less_eq"><const>medium</const></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Serif CJK JP Medium</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Serif CJK KR</string></test>
    <test name="weight" qual="all" compare="less_eq"><const>medium</const></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Serif CJK KR Medium</string></edit>
  </match>
</fontconfig>
