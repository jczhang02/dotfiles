# Vim-specific additions; Yazi's matching default bindings remain active.

[mgr]
prepend_keymap = [
  { on = "l", run = "plugin smart-enter", desc = "Enter directory or open file" },
  { on = "<Enter>", run = "plugin smart-enter", desc = "Enter directory or open file" },

  # Keep f<char> for Vim-style jumps and move filtering to F.
  { on = "f", run = "plugin jump-to-char", desc = "Jump to character" },
  { on = "F", run = "filter --smart", desc = "Filter files" },

  # Numeric Vim motions: 3j, 12k, 10gg, 2yy, 3dd, and similar commands.
  { on = "1", run = "plugin relative-motions 1", desc = "Vim count motion" },
  { on = "2", run = "plugin relative-motions 2", desc = "Vim count motion" },
  { on = "3", run = "plugin relative-motions 3", desc = "Vim count motion" },
  { on = "4", run = "plugin relative-motions 4", desc = "Vim count motion" },
  { on = "5", run = "plugin relative-motions 5", desc = "Vim count motion" },
  { on = "6", run = "plugin relative-motions 6", desc = "Vim count motion" },
  { on = "7", run = "plugin relative-motions 7", desc = "Vim count motion" },
  { on = "8", run = "plugin relative-motions 8", desc = "Vim count motion" },
  { on = "9", run = "plugin relative-motions 9", desc = "Vim count motion" },

  { on = "!", run = 'shell "$SHELL" --block', desc = "Open shell here", for = "unix" },
  { on = [ "g", "r" ], run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"', desc = "Git root" },
]

[cmp]
prepend_keymap = [
  { on = "<C-k>", run = "arrow prev", desc = "Previous completion" },
  { on = "<C-j>", run = "arrow next", desc = "Next completion" },
]
