name: jc-writing-style
version: 0.1.0
description: Declarative manifest for JC Zhang's personal writing-style skill.

always_load:
  - static/core/stance.md
  - static/core/workflow.md
  - static/core/anti-ai.md
  - static/core/output-format.md

axes:
  mode:
    detect: |
      Decide which personal style is needed.
      Use chinese-writing for Chinese manuscript/report/project prose.
      Use english-writing for English academic manuscript prose, especially ML/math/algorithm papers.
      Use defense for Chinese oral defense scripts, slide narration, competition reports, and speeches.
    values:
      chinese-writing: static/fragments/mode/chinese-writing.md
      english-writing: static/fragments/mode/english-writing.md
      defense: static/fragments/mode/defense.md
    default: chinese-writing
    multi: false

references:
  on_demand:
    - condition: user asks for style evidence, provenance, or source coverage; updating this skill
      path: references/source-files.md
    - condition: user asks for examples or output needs rhythm calibration
      path: references/examples.md
